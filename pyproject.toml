[build-system]
# Keep this minimal so the isolated/overlay env doesn't try to fetch torch.
requires = [
    "setuptools>=64",
    "wheel",
    "pybind11"
]
build-backend = "setuptools.build_meta"

[project]
name = "Voxelium"
version = "0.0.3"
description = "Voxelium - a powerful tool for volumetric processing with CUDA support."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }

# Prefer project.license-files going forward (setuptools deprecation warning fix).
license-files = []

authors = [
    { name = "Dari Kimanius", email = "dari.kimanius@czii.org" }
]
keywords = ["CryoEM", "CryoET", "Reconstruction", "ML"]

# Runtime deps (torch is preinstalled in the image at build time, but remains a runtime dep).
dependencies = [
    "torch==2.8.0",
    "torchvision",
    "loguru", 
    "matplotlib",
    "mrcfile", 
    "numpy==1.*", 
    "vtk", 
    "scikit-learn",
    "scipy", 
    "tensorboard",
    "tqdm",
    "starfile",
    "umap-learn",
    "imageio",
    "msgpack",
    "healpy"
]

[tool.setuptools]
# Deprecated in future, but harmless to keep empty; we moved the setting above.
license-files = []
include-package-data = true

[tool.setuptools.packages.find]
include = ["voxelium", "voxelium.*"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "voxelium/torch_extensions/sparse3d",
    "voxelium/torch_extensions/inplace_topk"
]