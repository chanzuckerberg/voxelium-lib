name: Build manylinux Wheels with CUDA

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build wheels on custom manylinux+CUDA
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [cp39, cp310, cp311, cp312]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build custom manylinux+CUDA Docker image
        run: |
          docker build -t cuda-manylinux:latest -f Dockerfile.cuda-manylinux .

      - name: Install pip and cibuildwheel
        run: |
          python3 -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build manylinux wheels using custom image
        run: cibuildwheel --platform linux --output-dir wheelhouse
        env:
          # Which CPython ABIs to build
          CIBW_BUILD: ${{ matrix.python-version }}-*
          # We’re not building musllinux here
          CIBW_SKIP: "*-musllinux_*"
          # Use your custom CUDA-capable manylinux image
          CIBW_MANYLINUX_X86_64_IMAGE: cuda-manylinux:latest
          # Arch
          CIBW_ARCHS: x86_64
          # Extra logging
          CIBW_BUILD_VERBOSITY: "3"

          # Build-time environment (visible to your setup.py)
          CIBW_ENVIRONMENT: |
            CUDA_HOME=/usr/local/cuda-12.6
            NVCC_ARCHS=61,70,75,80,86,87,89,90

          # (Optional) keep downloads smaller in CI:
          # 1) install CPU-only torch/torchvision in the build venv
          # 2) tell setup to NOT link libtorch_cuda when building wheels
          CIBW_BEFORE_BUILD: |
            python -m pip install --upgrade pip
            pip install --extra-index-url https://download.pytorch.org/whl/cpu \
              "torch==2.8.0" "torchvision==0.23.0"
            export VOXELIUM_LINK_TORCH_CUDA=0

          # Don’t vendor the giant libtorch* libs into your wheel
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair
            --exclude libtorch.so
            --exclude libtorch_cpu.so
            --exclude libtorch_cuda.so
            --exclude libtorch_python.so
            --exclude libc10.so
            --exclude libc10_cuda.so
            -w {dest_dir} {wheel}

      - name: Upload built wheels (per-ABI)
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.python-version }}
          path: wheelhouse/

      - name: Validate wheels with twine
        run: |
          python -m pip install --upgrade twine
          twine check wheelhouse/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          twine upload wheelhouse/*

      # For TestPyPI, uncomment below and add TEST_PYPI_API_TOKEN secret
      # - name: Publish to TestPyPI
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      #   run: |
      #     python -m pip install --upgrade twine
      #     twine upload --repository-url https://test.pypi.org/legacy/ wheelhouse/* --verbose