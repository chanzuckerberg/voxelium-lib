name: Build manylinux Wheels with CUDA

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build wheels on custom manylinux+CUDA
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [cp39, cp310, cp311, cp312]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build custom manylinux+CUDA Docker image
        run: |
          docker build -t cuda-manylinux:latest -f Dockerfile.cuda-manylinux .

      - name: Install pip and cibuildwheel
        run: |
          python3 -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build manylinux wheels using custom image
        env:
          # Choose CPython versions
          CIBW_BUILD: ${{ matrix.python-version }}-*
          # Not building PyPy or musllinux wheels
          CIBW_SKIP: "pp* *-musllinux_*"

          # This env is injected into the isolated build (python -m build)
          CIBW_ENVIRONMENT: |
            CUDA_HOME=/usr/local/cuda-12.6
            NVCC_ARCHS=61,70,75,80,86,87,89,90
            # Ensure our setup.py avoids linking libtorch_cuda in CI
            VOXELIUM_LINK_TORCH_CUDA=0

          # Use your CUDA-enabled manylinux base
          CIBW_MANYLINUX_X86_64_IMAGE: cuda-manylinux:latest
          CIBW_ARCHS: "x86_64"

          # Keep downloads small: install CPU wheels from the PyTorch CPU index
          # (not on PyPI) just before build so headers are present.
          CIBW_BEFORE_BUILD: |
            set -eux
            echo "Disk before pip:"; df -h; df -i || true
            du -sh /tmp/* 2>/dev/null || true

            python -m pip install --upgrade pip
            # CPU wheels live on the PyTorch CPU index; add PyPI as extra for deps.
            python -m pip install --no-cache-dir \
              --index-url https://download.pytorch.org/whl/cpu \
              --extra-index-url https://pypi.org/simple \
              "torch==2.8.0+cpu" "torchvision==0.23.0+cpu"

            # Double-set for clarity; CIBW_ENVIRONMENT already exports this.
            export VOXELIUM_LINK_TORCH_CUDA=0

            # (Optional) show versions
            python - <<'PY'
            import torch, torchvision, sys
            print("Torch:", torch.__version__, "CUDA available:", torch.cuda.is_available(), file=sys.stderr)
            print("Torchvision:", torchvision.__version__, file=sys.stderr)
            PY

          # Don't vendor libtorch* into the wheel
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair
            --exclude libtorch.so
            --exclude libtorch_cpu.so
            --exclude libtorch_cuda.so
            --exclude libtorch_python.so
            --exclude libc10.so
            --exclude libc10_cuda.so
            -w {dest_dir} {wheel}

          # Extra logs while iterating
          CIBW_BUILD_VERBOSITY: "3"
        run: |
          cibuildwheel --platform linux --output-dir wheelhouse

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.python-version }}
          path: wheelhouse/

      - name: Validate wheel with twine
        run: |
          python -m pip install --upgrade twine
          twine check wheelhouse/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          twine upload wheelhouse/*

      # For TestPyPI, uncomment below and add TEST_PYPI_API_TOKEN secret
      # - name: Publish to TestPyPI
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      #   run: |
      #     python -m pip install --upgrade twine
      #     twine upload --repository-url https://test.pypi.org/legacy/ wheelhouse/* --verbose