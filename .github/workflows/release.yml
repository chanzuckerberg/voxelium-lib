name: Build manylinux Wheels and Release to PyPI

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - release-test
  workflow_dispatch:

jobs:
  build:
    name: Build wheels on manylinux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["cp39", "cp310", "cp311", "cp312"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (required for emulated platforms)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install pip and cibuildwheel
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build manylinux wheels
        run: |
          cibuildwheel --platform linux --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.python-version }}-* 
          CIBW_SKIP: "pp*"
          CIBW_ENVIRONMENT: "NVCC_ARCHS=61,70,75,80,86,87,89,90"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

      - name: Upload Wheels to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.python-version }}

      # - name: Publish to PyPI
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: |
      #     python -m pip install --upgrade twine
      #     twine upload wheelhouse/*
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      
      - name: Publish to TestPyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -m pip install --upgrade twine
          twine upload --repository-url https://test.pypi.org/legacy/ wheelhouse/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
