name: Build manylinux Wheels with CUDA (preinstalled Torch)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build wheels on custom manylinux+CUDA (preinstalled torch)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [cp39, cp310, cp311, cp312]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # This Dockerfile MUST preinstall torch==2.8.0 + torchvision for each /opt/python/cp3*-*/bin/python
      # (as we discussed). It should also have CUDA 12.6 toolchain.
      - name: Build custom manylinux+CUDA Docker image (with preinstalled torch 2.8.0)
        run: |
          docker build -t cuda-manylinux:preinstalled-torch -f Dockerfile.cuda-manylinux .

      - name: Install pip and cibuildwheel
        run: |
          python3 -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build manylinux wheels using custom image
        run: |
          cibuildwheel --platform linux --output-dir wheelhouse
        env:
          # Select CPython tags to build
          CIBW_BUILD: ${{ matrix.python-version }}-*
          CIBW_SKIP: "pp* *-musllinux_*"
          CIBW_ARCHS: "x86_64"

          # Use the image that already contains torch 2.8.0 for each interpreter
          CIBW_MANYLINUX_X86_64_IMAGE: cuda-manylinux:preinstalled-torch

          # Crucial: expose preinstalled torch to setup.py (no build isolation overlay)
          CIBW_ENVIRONMENT: |
            PIP_NO_BUILD_ISOLATION=1
            PIP_DISABLE_PIP_VERSION_CHECK=1
            PIP_NO_CACHE_DIR=1
            CUDA_HOME=/usr/local/cuda-12.6
            NVCC_ARCHS=61,70,75,80,86,87,89,90
            # Optional toggle to avoid linking torch_cuda (leave at 1 for GPU wheels)
            VOXELIUM_LINK_TORCH_CUDA=1
            # Optional: let nvcc know about architectures in Torch builds
            TORCH_CUDA_ARCH_LIST=8.0;8.6;8.9;9.0+PTX

          # Keep torch libs external; auditwheel will not bundle them when excluded
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair
            --exclude libtorch.so
            --exclude libtorch_cpu.so
            --exclude libtorch_cuda.so
            --exclude libtorch_python.so
            --exclude libc10.so
            --exclude libc10_cuda.so
            -w {dest_dir} {wheel}

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.python-version }}
          path: wheelhouse/

      - name: Validate wheel with twine
        run: |
          python -m pip install --upgrade twine
          twine check wheelhouse/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -m pip install --upgrade twine
          twine upload wheelhouse/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      # Uncomment for TestPyPI
      # - name: Publish to TestPyPI
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: |
      #     python -m pip install --upgrade twine
      #     twine upload --repository-url https://test.pypi.org/legacy/ wheelhouse/* --verbose
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}