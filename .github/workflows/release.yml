name: Build manylinux Wheels with CUDA

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build wheels on custom manylinux+CUDA
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [cp39, cp310, cp311, cp312]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build custom manylinux+CUDA Docker image
        run: |
          docker build -t cuda-manylinux:latest -f Dockerfile.cuda-manylinux .

      - name: Install pip and cibuildwheel
        run: |
          python3 -m pip install --upgrade pip
          pip install cibuildwheel==3.1.4

      - name: Build manylinux wheels using custom image
        run: |
          cibuildwheel --platform linux --output-dir wheelhouse
        env:
          # matrix
          CIBW_BUILD: ${{ matrix.python-version }}-*
          CIBW_SKIP: "pp* *-musllinux_*"
          CIBW_ARCHS: "x86_64"

          # use our custom image
          CIBW_MANYLINUX_X86_64_IMAGE: cuda-manylinux:latest

          # IMPORTANT: use pip frontend with NO build isolation so torch installed below is visible
          CIBW_BUILD_FRONTEND: pip
          PIP_NO_BUILD_ISOLATION: "1"

          # Build env seen by setup.py
          CIBW_ENVIRONMENT: |
            CUDA_HOME=/usr/local/cuda-12.6
            NVCC_ARCHS=61,70,75,80,86,87,89,90
            # Don’t explicitly link torch_cuda.* in CI to avoid accidental coupling
            VOXELIUM_LINK_TORCH_CUDA=0

          # Install a *CPU* PyTorch in the build environment to keep downloads smaller
          # (CPU wheels are hosted on the PyTorch index)
          CIBW_BEFORE_BUILD: |
            set -eux
            python -m pip install --upgrade pip
            python -m pip install --no-cache-dir \
              --index-url https://download.pytorch.org/whl/cpu \
              --extra-index-url https://pypi.org/simple \
              "torch==2.8.0+cpu" "torchvision==0.23.0+cpu"

          # Don’t vendor torch libs into our wheel
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair
            --exclude libtorch.so
            --exclude libtorch_cpu.so
            --exclude libtorch_cuda.so
            --exclude libtorch_python.so
            --exclude libc10.so
            --exclude libc10_cuda.so
            -w {dest_dir} {wheel}

          # helpful logs
          CIBW_BEFORE_ALL: |
            mkdir -p /project/.tmp
            echo "Disk before pip:"; df -h; df -i || true
            du -sh /tmp/* 2>/dev/null || true
          CIBW_BUILD_VERBOSITY: "3"

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.python-version }}
          path: wheelhouse/

      - name: Validate wheel with twine
        run: |
          python -m pip install --upgrade twine
          twine check wheelhouse/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          twine upload wheelhouse/*

      # # Uncomment below for Test PyPI publish
      # - name: Publish to TestPyPI
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      #   run: |
      #     python -m pip install --upgrade twine
      #     twine upload --repository-url https://test.pypi.org/legacy/ wheelhouse/* --verbose