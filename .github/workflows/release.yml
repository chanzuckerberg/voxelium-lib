name: Build and Release to PyPI

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - release-test
  workflow_dispatch:


jobs:
  build_wheels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install build dependencies
        run: |
          pip install cibuildwheel==2.16.0
          pip install pybind11==2.13.6 torch==2.2.0 torchvision "numpy<2"
      
      # For now, skip building the CUDA extension since the standard manylinux container
      # doesn't include CUDA. Remove or unset VOXELIUM_SKIP_EXT if you have a custom image.
      - name: Build manylinux wheels
        env:
          NVCC_ARCHS: "61,70,75,80,86,87,89,90"
          VOXELIUM_SKIP_EXT: "TRUE"
        run: |
          cibuildwheel --output-dir wheelhouse .
      
      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/
  
  test_wheels:
    runs-on: ubuntu-latest
    needs: build_wheels
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download wheels artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheelhouse
      
      - name: Install built wheel
        run: |
          pip install wheelhouse/*.whl
      
      - name: Run tests
        run: |
          pytest voxelium/torch_extensions/sparse3d/test.py    
          
          

