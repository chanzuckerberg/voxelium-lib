name: Build manylinux Wheels with CUDA

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - release-test
  workflow_dispatch:

jobs:
  build:
    name: Build wheels on custom manylinux+CUDA
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [cp39, cp310, cp311, cp312]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build custom manylinux+CUDA Docker image
        run: |
          docker build -t cuda-manylinux:latest -f Dockerfile.cuda-manylinux .

      - name: Install pip and cibuildwheel
        run: |
          python3 -m pip install --upgrade pip
          pip install cibuildwheel

      # - name: Download LibTorch
      #   run: |
      #     mkdir -p third_party
      #     curl -L https://download.pytorch.org/libtorch/cu121/libtorch-cxx11-abi-shared-with-deps-2.2.2%2Bcu121.zip -o libtorch.zip
      #     unzip libtorch.zip -d third_party/
      #     LIBTORCH_DIR=$(find third_party -maxdepth 1 -type d -name 'libtorch*' | head -n 1)
      #     if [[ "$LIBTORCH_DIR" != "third_party/libtorch" ]]; then
      #       mv "$LIBTORCH_DIR" third_party/libtorch
      #     fi
      
      # - name: Prune LibTorch
      #   run: |
      #     rm -rf third_party/libtorch/lib/*.a
      #     rm -rf third_party/libtorch/share

      - name: Build manylinux wheels using custom image
        run: |
          cibuildwheel --platform linux --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.python-version }}-*
          CIBW_SKIP: "pp* *-musllinux_*"
          CIBW_ENVIRONMENT: "CUDA_HOME=/usr/local/cuda-12.6 NVCC_ARCHS=61,70,75,80,86,87,89,90"
          CIBW_MANYLINUX_X86_64_IMAGE: cuda-manylinux:latest
          CIBW_ARCHS: "x86_64"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: ""

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.python-version }}
          path: wheelhouse/
      
      # Uncomment below for PyPI publish
      # - name: Publish to PyPI
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: |
      #     python -m pip install --upgrade twine
      #     twine upload wheelhouse/*
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to TestPyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -m pip install --upgrade twine
          twine upload --repository-url https://test.pypi.org/legacy/ wheelhouse/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}





