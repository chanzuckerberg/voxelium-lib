name: Build manylinux Wheels with CUDA

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build wheels on custom manylinux+CUDA
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [cp39, cp310, cp311, cp312]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space (optional but helpful)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache || true
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build custom manylinux+CUDA Docker image
        run: |
          docker build -t cuda-manylinux:latest -f Dockerfile.cuda-manylinux .

      - name: Install pip and cibuildwheel
        run: |
          python3 -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build manylinux wheels using custom image
        run: |
          cibuildwheel --platform linux --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.python-version }}-*
          CIBW_SKIP: "pp* *-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: cuda-manylinux:latest
          CIBW_ARCHS: "x86_64"
          CIBW_BUILD_VERBOSITY: "3"
          # Environment inside the build container
          CIBW_ENVIRONMENT: |
            CUDA_HOME=/usr/local/cuda-12.6
            NVCC_ARCHS=61,70,75,80,86,87,89,90
            # Use CPU index DURING BUILD ISOLATION to avoid huge CUDA downloads
            PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu
            PIP_NO_CACHE_DIR=1
            TMPDIR=/project/.tmp
          # Pre-build diagnostics + ensure TMPDIR exists
          CIBW_BEFORE_BUILD: |
            mkdir -p /project/.tmp
            echo "Disk before pip:"; df -h; df -i || true
            du -sh /tmp/* 2>/dev/null || true
          # Repair while excluding PyTorch shared libs (they're provided by torch)
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair
            --exclude libtorch.so
            --exclude libtorch_cpu.so
            --exclude libtorch_cuda.so
            --exclude libtorch_python.so
            --exclude libc10.so
            --exclude libc10_cuda.so
            -w {dest_dir} {wheel}

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.python-version }}
          path: wheelhouse/

      - name: Validate wheel with twine
        run: |
          python -m pip install --upgrade twine
          twine check wheelhouse/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -m pip install --upgrade twine
          twine upload wheelhouse/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      # Uncomment below for TestPyPI publish
      # - name: Publish to TestPyPI
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: |
      #     python -m pip install --upgrade twine
      #     twine upload --repository-url https://test.pypi.org/legacy/ wheelhouse/* --verbose
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}